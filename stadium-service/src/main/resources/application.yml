server:
  port: 8082

spring:
  application:
    name: stadium-service
  datasource:
    url: jdbc:h2:mem:stadiumdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
