# Application
spring.application.name=inscription-service
server.port=8083

# Charger la configuration depuis le Config Server
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.fail-fast=false

# H2 Database
spring.datasource.url=jdbc:h2:mem:inscriptiondb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# OpenFeign Timeouts - NOUVEAU !
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.user-service.connectTimeout=10000
feign.client.config.user-service.readTimeout=10000

# Logging pour debug Feign
logging.level.org.example.inscriptionservice.client=DEBUG

spring.profiles.active=default
spring.cloud.config.uri=http://localhost:8888
# Les propriétés spécifiques sont maintenant centralisées dans le config server.
