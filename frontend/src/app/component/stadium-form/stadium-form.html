<form [formGroup]="stadiumForm" (ngSubmit)="onSubmit()" class="stadium-form">
	<h2>Créer / Modifier un Stade</h2>
	<div class="form-group">
		<label for="name">Nom du stade</label>
		<input id="name" formControlName="name" type="text" placeholder="Nom du stade" />
		<div class="error" *ngIf="f.name.touched && f.name.invalid">
			<span *ngIf="f.name.errors?.required">Le nom est requis.</span>
			<span *ngIf="f.name.errors?.maxlength">100 caractères max.</span>
		</div>
	</div>

	<div class="form-group">
		<label for="pricePerHour">Prix par heure (€)</label>
		<input id="pricePerHour" formControlName="pricePerHour" type="number" min="0" step="0.01" placeholder="Prix par heure" />
		<div class="error" *ngIf="f.pricePerHour.touched && f.pricePerHour.invalid">
			<span *ngIf="f.pricePerHour.errors?.required">Le prix est requis.</span>
			<span *ngIf="f.pricePerHour.errors?.min">Le prix doit être positif.</span>
		</div>
	</div>

	<div class="form-group">
		<label for="description">Description</label>
		<textarea id="description" formControlName="description" rows="3" placeholder="Description du stade"></textarea>
		<div class="error" *ngIf="f.description.touched && f.description.invalid">
			<span *ngIf="f.description.errors?.maxlength">500 caractères max.</span>
		</div>
	</div>

	<div class="form-group">
		<label for="imageUrl">Image (URL)</label>
		<input id="imageUrl" formControlName="imageUrl" type="url" placeholder="https://..." />
		<div class="error" *ngIf="f.imageUrl.touched && f.imageUrl.invalid">
			<span *ngIf="f.imageUrl.errors?.pattern">URL invalide.</span>
		</div>
	</div>

	<div class="form-group">
		<label for="location">Localisation</label>
		<input id="location" formControlName="location" type="text" placeholder="Adresse ou localisation" />
		<div class="error" *ngIf="f.location.touched && f.location.invalid">
			<span *ngIf="f.location.errors?.required">La localisation est requise.</span>
			<span *ngIf="f.location.errors?.maxlength">200 caractères max.</span>
		</div>
	</div>

	<div class="form-group switch-group">
		<label for="available">Disponible</label>
		<label class="switch">
			<input id="available" type="checkbox" formControlName="available" />
			<span class="slider"></span>
		</label>
	</div>

	<button type="submit" class="btn-primary" [disabled]="stadiumForm.invalid">Enregistrer</button>
</form>
