server:
  port: 8081

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:

        # ROUTE Users Service
        - id: users-service
          uri: lb://USERS-SERVICE
          predicates:
            - Path=/users/**

        # ROUTE Inscription Service
        - id: inscription-service
          uri: lb://INSCRIPTION-SERVICE
          predicates:
            - Path=/inscription/**

        # ROUTE Soutenance Service
        - id: soutenance-service
          uri: lb://SOUTENANCE-SERVICE
          predicates:
            - Path=/soutenance/**

        # ROUTE Notification Service
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**

  config:
    import: optional:configserver:http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
