<!-- src/app/components/navbar/navbar.component.html -->
<nav class="side-navbar">
  <div class="side-navbar-brand">
    <span class="trophy-icon">🏆</span>
    <span class="brand-title">FootReserve</span>
  </div>
  <ul class="side-navbar-menu">
    <li>
      <a routerLink="/dashboard" routerLinkActive="active">
        <span class="menu-icon">🏠</span> Dashboard
      </a>
    </li>
    <li>
      <a routerLink="/stadiums" routerLinkActive="active">
        <span class="menu-icon">🏟️</span> Stadiums
      </a>
    </li>
    <li>
      <a routerLink="/my-bookings" routerLinkActive="active">
        <span class="menu-icon">📅</span> My Bookings
      </a>
    </li>
  </ul>
  <div class="side-navbar-user">
    <div *ngIf="isLoggedIn" class="user-info">
      <div class="avatar-circle">{{ currentUser?.username?.charAt(0)?.toUpperCase() || 'P' }}</div>
      <div class="user-details">
        <div class="user-role">Pro Player</div>
        <div class="user-email">{{ currentUser?.email || 'sgdfg@gmail.com' }}</div>
      </div>
      <button (click)="logout()" class="btn btn-signout">Sign Out</button>
    </div>
    <div *ngIf="!isLoggedIn" class="auth-buttons">
      <a routerLink="/login" class="btn btn-outline">Sign In</a>
      <a routerLink="/register" class="btn btn-primary">Sign Up</a>
    </div>
  </div>
</nav>
