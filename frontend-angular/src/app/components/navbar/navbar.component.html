<!-- src/app/components/navbar/navbar.component.html -->
<nav class="side-navbar">
  <div class="navbar-content-flex">

    <!-- LOGO PRO -->
    <a routerLink="/" class="navbar-brand">
      <div class="brand-icon">FR</div>
      <span class="brand-text">FootReserve</span>
    </a>

    <!-- ================= MENU ================= -->

    <!-- ADMIN -->
    <ul class="navbar-menu" *ngIf="isAdmin">
      <li>
        <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
      </li>
      <li>
        <a routerLink="/admin/stadium/create" routerLinkActive="active">Add Stadium</a>
      </li>
      <li>
        <a routerLink="/stadiums" routerLinkActive="active">All Stadiums</a>
      </li>
      <li>
        <a routerLink="/admin/reservations" routerLinkActive="active">Bookings</a>
      </li>
    </ul>

    <!-- USER -->
    <ul class="navbar-menu" *ngIf="!isAdmin && isLoggedIn">
      <li>
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      </li>
      <li>
        <a routerLink="/stadiums" routerLinkActive="active">Stadiums</a>
      </li>
      <li>
        <a routerLink="/my-bookings" routerLinkActive="active">My Bookings</a>
      </li>
    </ul>

    <!-- VISITOR -->
    <ul class="navbar-menu" *ngIf="!isLoggedIn">
      <li>
        <a routerLink="/stadiums" routerLinkActive="active">Stadiums</a>
      </li>
      <li>
        <a routerLink="/login" routerLinkActive="active">Login</a>
      </li>
      <li>
        <a routerLink="/register" routerLinkActive="active">Register</a>
      </li>
    </ul>

    <!-- ================= USER ACTIONS ================= -->
    <div class="navbar-right" *ngIf="isLoggedIn">
      <div class="user-profile">
        <div class="user-avatar">
          {{ currentUser?.username?.charAt(0)?.toUpperCase() || 'U' }}
        </div>
      </div>

      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>

  </div>
</nav>
