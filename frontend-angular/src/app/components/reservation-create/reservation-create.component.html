<!-- src/app/components/reservation-create/reservation-create.component.html -->
<div class="reservation-container">
  <div class="reservation-card">

    <!-- TITLE -->
    <h2 class="page-title">Créer une réservation</h2>

    <!-- STADIUM INFO CARD -->
    <div *ngIf="stadium" class="stadium-info">
      <h3>{{ stadium.name }}</h3>

      <div class="stadium-meta">
        <!-- LOCATION -->
        <div class="meta-item">
          <span class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </span>
          <span>{{ stadium.location }}</span>
        </div>

        <!-- PRICE -->
        <div class="meta-item price">
          <span class="icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
          </span>
          <span>{{ stadium.pricePerHour }} DH / heure</span>
        </div>
      </div>
    </div>

    <!-- FORM -->
    <form (ngSubmit)="onSubmit()" #reservationForm="ngForm">

      <!-- CIN NUMBER -->
      <div class="form-group">
        <label>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="M7 15h0M2 9.5h20"></path>
          </svg>
          Numéro CIN
        </label>
        <input
          type="text"
          name="cin"
          [(ngModel)]="reservation.cin"
          required
          maxlength="10"
          class="form-control"
          placeholder="Ex: AB123456"
        />
      </div>

      <!-- CIN FILE UPLOAD -->
      <div class="form-group">
        <label>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Copie CIN (PDF / Image)
        </label>
        <input
          type="file"
          name="cinFile"
          (change)="onFileSelected($event)"
          accept="image/*,application/pdf"
          required
          class="form-control"
        />

        <small *ngIf="cinFile" class="file-info">
          Fichier sélectionné : {{ cinFile.name }}
        </small>
      </div>

      <!-- DATE -->
      <div class="form-group">
        <label>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Date de réservation
        </label>
        <input
          type="date"
          name="date"
          [(ngModel)]="reservation.date"
          required
          [min]="getTodayDate()"
          class="form-control"
        />
      </div>

      <!-- TIME SLOTS -->
      <div class="form-row">
        <div class="form-group">
          <label>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Heure de début
          </label>
          <input
            type="time"
            name="heureDebut"
            [(ngModel)]="reservation.heureDebut"
            required
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Heure de fin
          </label>
          <input
            type="time"
            name="heureFin"
            [(ngModel)]="reservation.heureFin"
            required
            class="form-control"
          />
        </div>
      </div>

      <!-- PRICE CALCULATION -->
      <div *ngIf="calculatePrice() > 0" class="price-box">
        <span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
            <path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          Prix total estimé
        </span>
        <strong>{{ calculatePrice() }} DH</strong>
      </div>

      <!-- ERROR MESSAGE -->
      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <!-- FORM ACTIONS -->
      <div class="form-actions">
        <button
          type="button"
          class="btn btn-cancel"
          routerLink="/stadiums"
          [disabled]="loading"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Annuler
        </button>

        <button
          type="submit"
          class="btn btn-confirm"
          [disabled]="loading || !reservationForm.valid || !cinFile"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" *ngIf="!loading">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" *ngIf="loading" style="animation: spin 1s linear infinite;">
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
          </svg>
          {{ loading ? 'Traitement en cours...' : 'Confirmer la réservation' }}
        </button>
      </div>

    </form>
  </div>
</div>

<style>
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
