<div class="stadium-create-container fade-in">
  <div class="page-header">
    <button class="btn-back" (click)="goBack()">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Back
    </button>
    <h1>{{ isEditMode ? 'Edit Stadium' : 'Add New Stadium' }}</h1>
    <p class="subtitle">Fill in the stadium details</p>
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="alert alert-success">
    <svg viewBox="0 0 24 24" fill="currentColor" class="icon">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
    </svg>
    {{ successMessage }}
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    <svg viewBox="0 0 24 24" fill="currentColor" class="icon">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </svg>
    {{ errorMessage }}
  </div>

  <!-- Form -->
  <form class="stadium-form" (ngSubmit)="onSubmit()" #stadiumForm="ngForm">
    <div class="form-card">
      <h3 class="form-section-title">
        <svg viewBox="0 0 24 24" fill="currentColor" class="section-icon">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        Basic Information
      </h3>

      <div class="form-row">
        <div class="form-group">
          <label for="name">Stadium Name *</label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="stadium.name"
            required
            class="form-control"
            placeholder="e.g., Stade Mohammed V"
          />
        </div>

        <div class="form-group">
          <label for="location">Location *</label>
          <input
            type="text"
            id="location"
            name="location"
            [(ngModel)]="stadium.location"
            required
            class="form-control"
            placeholder="e.g., Casablanca, Morocco"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description *</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="stadium.description"
          required
          rows="4"
          class="form-control"
          placeholder="Describe the stadium facilities, features, etc."
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="pricePerHour">Price per Hour (DH) *</label>
          <input
            type="number"
            id="pricePerHour"
            name="pricePerHour"
            [(ngModel)]="stadium.pricePerHour"
            required
            min="0"
            class="form-control"
            placeholder="e.g., 250"
          />
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input
              type="checkbox"
              name="available"
              [(ngModel)]="stadium.available"
              class="checkbox-input"
            />
            <span class="checkbox-text">Stadium Available for Booking</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="imageUrl">Image URL *</label>
        <input
          type="url"
          id="imageUrl"
          name="imageUrl"
          [(ngModel)]="stadium.imageUrl"
          required
          class="form-control"
          placeholder="https://example.com/stadium-image.jpg"
        />
        <small class="form-hint">Paste a direct link to an image (e.g., from Unsplash)</small>
      </div>

      <!-- Image Preview -->
      <div *ngIf="stadium.imageUrl" class="image-preview">
        <p class="preview-label">Image Preview:</p>
        <img [src]="stadium.imageUrl" alt="Stadium preview" class="preview-image" />
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="goBack()">
        Cancel
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading || !stadiumForm.valid"
      >
        <span *ngIf="loading">
          <span class="spinner"></span>
          {{ isEditMode ? 'Updating...' : 'Creating...' }}
        </span>
        <span *ngIf="!loading">
          {{ isEditMode ? '💾 Update Stadium' : '✨ Create Stadium' }}
        </span>
      </button>
    </div>
  </form>
</div>
