# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=users-service
spring.profiles.active=default
spring.cloud.config.uri=http://localhost:8888
server.port=8082

# Les propri�t�s sp�cifiques sont maintenant centralis�es dans le config server.

# ============================================
# CONFIG SERVER IMPORT
# ============================================
# Charger les propri�t�s depuis le Config Server (optionnel: pour ne pas planter si indisponible)
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.fail-fast=false


# ============================================
# SUPABASE / POSTGRESQL CONFIGURATION
# ============================================
spring.datasource.url=jdbc:postgresql://db.ninfjedrwxaezrhslvod.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=[YOUR-PASSWORD]
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE (POSTGRESQL)
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================
# EUREKA CLIENT CONFIGURATION
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ============================================
# ACTUATOR CONFIGURATION
# ============================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always